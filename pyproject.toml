[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constellation"
version = "0.1.0"
description = "A digital communications link, built and measured against theory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
constellation = "constellation.__main__:main"

[tool.setuptools]
packages = ["constellation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
